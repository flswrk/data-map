  const roots = kids.get('_root')||[];
  if(!roots.length){
    wrap.append(h('div',{class:'fempty'},
      h('p',{text:'No folders yet.'}),
      h('button',{class:'btn primary',onclick:()=>openFolderSheet({})}, ic('plus',14),'New folder')));
    return;
  }
  const items = new Map();
  Model.contentsOf(b.id).forEach(c=>{ if(!byId.has(c.folderId)) return; if(!items.has(c.folderId)) items.set(c.folderId,[]); items.get(c.folderId).push(c); });
  items.forEach(a=>a.sort(byName));
  // searching: keep only folders / items that match, plus the folders leading to them
  const selfHit = f => matchesQuery(textOf(f.name,f.note));
  const itemHit = it => matchesQuery(textOf(it.name,it.note));
  const vis = new Map();
  const nodeVisible = f=>{
    if(!S.q) return true;
    if(vis.has(f.id)) return vis.get(f.id);
    vis.set(f.id,false);
    const v = selfHit(f) || (items.get(f.id)||[]).some(itemHit) || (kids.get(f.id)||[]).some(nodeVisible);
    vis.set(f.id,v); return v;
  };
  const memo = new Map();
  const stat = f=>{
    if(memo.has(f.id)) return memo.get(f.id);
    memo.set(f.id,{fc:0,ic:0});
    let fc=0, n=(items.get(f.id)||[]).length;
    (kids.get(f.id)||[]).forEach(c=>{ const s=stat(c); fc+=1+s.fc; n+=s.ic; });
    const r={fc,ic:n}; memo.set(f.id,r); return r;
  };
  let totalItems = 0; items.forEach(a=>totalItems+=a.length);
  const expandable = [...byId.values()].filter(f=>(kids.get(f.id)||[]).length || (items.get(f.id)||[]).length);
  wrap.append(h('div',{class:'ftool'},
    h('span',{class:'cnt-all',text:byId.size+' folder'+(byId.size===1?'':'s')+' · '+totalItems+' item'+(totalItems===1?'':'s')}),
    h('span',{class:'sp'}),
    h('button',{class:'btn sm',onclick:()=>{ S.collapsed.clear(); render(); }},'Expand all'),
    h('button',{class:'btn sm',onclick:()=>{ expandable.forEach(f=>S.collapsed.add(f.id)); render(); }},'Collapse all')));

  const toggle = f=>{ if(S.collapsed.has(f.id)) S.collapsed.delete(f.id); else S.collapsed.add(f.id); render(); };
  const itemEl = it=>{
    const row = h('div',{class:'irow'+(S.q&&itemHit(it)?' match':''),'data-id':it.id,tabindex:'0',title:'Edit item',
        onclick:()=>openContentSheet({id:it.id}),
        onkeydown:onActivateKey(()=>openContentSheet({id:it.id}))},
      h('span',{class:'di'}, ic('doc',15)),
      h('span',{class:'in'}, highlightIfSearching(it.name||'(unnamed)'), it.note ? h('span',{class:'inote'}, highlightIfSearching(it.note)) : null));
    return h('div',{class:'tnode item'}, row);
  };
  const nodeEl = (f, isRoot)=>{
    const ch = (kids.get(f.id)||[]).filter(nodeVisible);
    const its = (items.get(f.id)||[]).filter(it=>!S.q || itemHit(it));      // searching: only matching items
    const has = ch.length>0 || its.length>0;
    const open = has && (S.q ? true : !S.collapsed.has(f.id));
    const st = stat(f);
    const parts = [];
    if(st.fc) parts.push(st.fc+' folder'+(st.fc===1?'':'s'));
    if(st.ic) parts.push(st.ic+' item'+(st.ic===1?'':'s'));
    const row = h('div',{class:'frow'+(S.q&&selfHit(f)?' match':''),'data-id':f.id,tabindex:'0',
        onclick:e=>{ if(e.target.closest('.acts')) return; if(has) toggle(f); },
        onkeydown:onActivateKey(()=>{ if(has) toggle(f); })},
      h('span',{class:'caret'+(has?(open?' open':''):' leaf'),'aria-hidden':'true'}, ic('caret',14)),
      h('span',{class:'fi'+(has?'':' leaf')}, ic(open?'folderOpen':'folder',18)),
      h('span',{class:'nm'+(f.note?' fit':''),title:Model.folderPath(f).map(x=>x.name).join(' / ')}, highlightIfSearching(f.name||'Untitled')),
      f.note ? h('span',{class:'inote',title:f.note}, highlightIfSearching(f.note)) : null,
      parts.length ? h('span',{class:'cnt',text:parts.join(' · ')}) : null,
      h('span',{class:'acts'},
        h('button',{class:'icon-btn','aria-label':'Add content',title:'Add content',onclick:e=>{ e.stopPropagation(); openContentSheet({folderId:f.id}); }}, ic('filePlus',16)),
        h('button',{class:'icon-btn','aria-label':'Add subfolder',title:'Add subfolder',onclick:e=>{ e.stopPropagation(); openFolderSheet({parentId:f.id}); }}, ic('folderPlus',16)),
        h('button',{class:'icon-btn','aria-label':'Edit folder',title:'Edit folder',onclick:e=>{ e.stopPropagation(); openFolderSheet({id:f.id}); }}, ic('edit',14))));
    const node = h('div',{class:'tnode'+(isRoot?' root':'')}, row);
    if(open){
      const box = h('div',{class:'children'});
      ch.forEach(c=>box.append(nodeEl(c,false)));
      its.forEach(it=>box.append(itemEl(it)));
      node.append(box);
    }
    return node;
  };
  const shownRoots = roots.filter(nodeVisible);
  if(S.q && !shownRoots.length){ wrap.append(h('div',{class:'fempty'}, h('p',{text:'No folders or items here match “'+S.q+'”.'}))); return; }
  shownRoots.forEach(f=>wrap.append(nodeEl(f,true)));
}

/* ---------- universal search ---------- */
/* The query is split into words (and the highlight pattern built) once per query, not once per item. */
let termsQuery = null, termsCache = [], highlightPattern = null;
function searchTerms(){
  if(termsQuery!==S.q){
    termsQuery = S.q;
    termsCache = S.q.split(/\s+/).filter(Boolean);
    highlightPattern = termsCache.length
      ? new RegExp('('+termsCache.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi')
      : null;
  }
  return termsCache;
}
function matchesQuery(text){ const t=String(text||'').toLowerCase(); return searchTerms().every(w=>t.includes(w)); }
function highlight(text){
  text = String(text==null?'':text);
  searchTerms();                                           // refresh the cached pattern for the current query
  if(!highlightPattern || !text) return [text];
  return text.split(highlightPattern).map((part,i)=> i%2 ? h('mark',{text:part}) : part);
}
function snippet(text){
  text = String(text||''); if(!text) return '';
  const low = text.toLowerCase(); let idx = -1;
  for(const w of searchTerms()){ const i=low.indexOf(w); if(i>=0){ idx=i; break; } }
  if(idx<0) return text.slice(0,160);
  const s = Math.max(0, idx-50);
  return (s>0?'…':'')+text.slice(s, s+180);
}

/* Every match on every board, grouped by board id. */
function searchAll(){
  const groups = new Map();
  const add = (bid,item)=>{ if(!groups.has(bid)) groups.set(bid,[]); groups.get(bid).push(item); };
  S.boards.forEach(b=>{ if(b.kind!=='favs' && boardHit(b)) add(b.id,{kind:'board',id:b.id,title:b.name}); });
  S.sections.forEach(s=>{
    const bid = boardOf(s); if(!S.boards.has(bid)) return;
    if(matchesQuery(textOf(s.name,s.description,s.url))) add(bid,{kind:'section',id:s.id,title:s.name,body:s.description,url:s.url});
  });
  S.folders.forEach(f=>{
    if(!S.boards.has(f.boardId)) return;
    if(matchesQuery(textOf(f.name,f.note))){ const path=Model.folderPath(f).slice(0,-1).map(x=>x.name).join(' / '); add(f.boardId,{kind:'folder',id:f.id,title:f.name,body:f.note,sub:path?'in '+path:'top level'}); }
  });
  S.contents.forEach(c=>{
    const f = S.folders.get(c.folderId); if(!f || !S.boards.has(f.boardId)) return;
    if(matchesQuery(textOf(c.name,c.note))) add(f.boardId,{kind:'item',id:c.id,folderId:f.id,title:c.name,body:c.note,sub:'in '+Model.folderPath(f).map(x=>x.name).join(' / ')});
  });
  S.cards.forEach(c=>{
    const s = S.sections.get(c.sectionId); if(!s) return;
    const bid = boardOf(s); if(!S.boards.has(bid)) return;
    if(cardHit(c)) add(bid,{kind:'card',id:c.id,title:c.title,sub:'in '+(s.name||'Untitled'),body:c.body,tags:c.tags,url:c.url});
  });
  return groups;
}

function expandFrom(folderId){
  let p = S.folders.get(folderId), g = 0;
  while(p && g++<50){ S.collapsed.delete(p.id); p = p.parentId ? S.folders.get(p.parentId) : null; }
}
function goTo(bid, item){
  if(item.kind==='folder'){ const f=S.folders.get(item.id); if(f && f.parentId) expandFrom(f.parentId); }
  if(item.kind==='item') expandFrom(item.folderId);
  S.flash = item.kind==='board' ? null : {kind:item.kind,id:item.id};
  S.listView = false; S.matchIdx = -1;
  selectBoard(bid);
}

/* `groups` is the searchAll() result render() already computed for this query. */
function renderResults(groups){
  resultsEl.replaceChildren();
  const wrap = h('div',{class:'res-wrap'});
  resultsEl.append(wrap);
  if(!ready()){ wrap.append(loadErrorNode('res-none') || h('div',{class:'res-none',text:'Loading…'})); return; }
  let total = 0; groups.forEach(a=>total+=a.length);
  if(!total){ wrap.append(h('div',{class:'res-none',text:'Nothing found on any board for “'+S.q+'”.'})); return; }
  wrap.append(h('div',{class:'res-head',text:total+' result'+(total===1?'':'s')+' across '+groups.size+' board'+(groups.size===1?'':'s')}));
  const order = {board:0,section:1,folder:2,item:3,card:4};
  let shown = 0; const CAP = 250;
  Model.boardsSorted().forEach(b=>{
    const items = groups.get(b.id); if(!items) return;
    items.sort((x,y)=>(order[x.kind]-order[y.kind])||cmp(x.title,y.title));
    const list = h('div',{class:'res-list'});
    for(const it of items){
      if(shown++>=CAP) break;
      const href = it.url ? safeHref(it.url) : null;
      list.append(h('div',{class:'res',tabindex:'0',onclick:e=>{ if(e.target.closest('a')) return; goTo(b.id,it); },onkeydown:onActivateKey(()=>goTo(b.id,it))},
        h('span',{class:'k',text:it.kind}),
        h('div',{style:'min-width:0;flex:1'},
          h('div',{class:'t'}, highlight(it.title||'(untitled)')),
          it.sub ? h('div',{class:'s'}, it.sub) : null,
          it.body ? h('div',{class:'b'}, highlight(snippet(it.body))) : null,
          (it.tags&&it.tags.length) ? h('div',{class:'tags'}, it.tags.map(t=>h('span',{class:'tag',style:tagStyle(t)}, highlight(t)))) : null,
          it.url ? h('div',{class:'c-meta'}, href ? h('a',{href,target:'_blank',rel:'noopener noreferrer',title:it.url}, linkText(it.url), ic('external',11)) : linkText(it.url)) : null)));
    }
    wrap.append(h('div',{class:'res-group'},
      h('div',{class:'res-gh'}, ic(b.kind==='folders'?'folder':'board',15), b.name||'Untitled', h('small',{text:'('+items.length+')'})),
      list));
  });
  if(total>CAP) wrap.append(h('div',{class:'res-head',text:'Showing the first '+CAP+'. Refine your search to narrow it down.'}));
}

/* =====================================================================
   Header wiring, keyboard shortcuts, banner and sync status
   ===================================================================== */
(function buildHeader(){
  const searchWrap = $('#searchWrap');
  searchWrap.append(ic('search',15));
  qInput = h('input',{type:'search',placeholder:'Search all boards…','aria-label':'Search all boards','aria-keyshortcuts':'/'});
  // The query is applied ~150 ms after typing stops. Enter applies it at once and jumps to the next match
  // (Shift+Enter: previous); typing alone never scrolls the page.
  let searchTimer;
  const applySearch = ()=>{
    const q = qInput.value.trim().toLowerCase();
    if(q===S.q) return;
    S.q = q; S.matchIdx = -1; if(!q) S.listView = false;
    render();
  };
  qInput.addEventListener('input',()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(applySearch,150); });
  qInput.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ clearTimeout(searchTimer); clearSearch(); render(); }
    else if(e.key==='Enter'){
      e.preventDefault(); clearTimeout(searchTimer); applySearch();
      if(S.q && !S.listView) stepMatch(e.shiftKey?-1:1);
    }
  });
  searchWrap.append(qInput);
  searchWrap.append(h('button',{class:'sclear',type:'button','aria-label':'Clear search',title:'Clear search',
    onclick:()=>{ clearSearch(); render(); qInput.focus(); }}, ic('close',14)));
  const whenLoaded = fn => ()=>{ if(!S.store) return toast('Still loading…'); fn(); };
  $('#actions').append(
    h('select',{id:'tagSel',class:'tagsel',hidden:true,'aria-label':'Filter cards by tag (all boards)',title:'Filter cards by tag (all boards)',onchange:e=>{ S.tag = e.target.value || null; S.matchIdx=-1; render(); }}),
    h('select',{id:'boardTagSel',class:'tagsel',hidden:true,'aria-label':'Filter boards by tag',title:'Filter boards by tag',onchange:e=>{ S.boardTag = e.target.value || null; S.matchIdx=-1; render(); }}),
    h('div',{class:'act-btns'},
      h('button',{class:'btn',id:'btnSection',hidden:true,onclick:whenLoaded(()=>openSectionEditor({}))}, ic('plus',14),'Section'),
      h('button',{class:'btn primary',id:'btnCard',hidden:true,onclick:whenLoaded(()=>openCardEditor({}))}, ic('plus',14),'Card'),
      h('button',{class:'btn primary',id:'btnFolder',hidden:true,onclick:whenLoaded(()=>openFolderSheet({}))}, ic('plus',14),'Folder'))
  );
})();

/* Esc closes the open sheet, otherwise clears the search.  "/" or Ctrl/⌘+K focuses the search box. */
document.addEventListener('keydown', e=>{
  const target = e.target;
  const typing = !!target && (/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName) || target.isContentEditable);
  if(e.key==='Escape'){
    if(sheetClose) closeSheet();
    else if(S.q && target!==qInput){ clearSearch(); render(); }
    return;
  }
  if(sheetClose || !qInput) return;
  const slash = e.key==='/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey;
  const findKey = (e.metaKey||e.ctrlKey) && !e.altKey && String(e.key).toLowerCase()==='k';
  if(slash || findKey){ e.preventDefault(); qInput.focus(); qInput.select(); }
});

/* arrow keys move between board tabs */
$('#tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
  const btns=[...document.querySelectorAll('#tabs .tab-main')], i=btns.indexOf(document.activeElement);
  if(i<0) return;
  e.preventDefault(); btns[(i+(e.key==='ArrowRight'?1:-1)+btns.length)%btns.length].focus();
});

/* ---------- banner (dismissible; optional Retry) ---------- */
function showBanner(msg, {retry=false}={}){
  const banner = $('#banner');
  banner.replaceChildren(...[
    h('span',{text:msg}),
    retry ? h('button',{class:'btn sm',type:'button',text:'Retry',onclick:()=>location.reload()}) : null,
    h('button',{class:'icon-btn',type:'button','aria-label':'Dismiss',title:'Dismiss',onclick:()=>{ banner.hidden = true; }}, ic('close',14))
  ].filter(Boolean));
  banner.hidden = false;
}
/* Loading failed for good: say so in the page itself (with Retry) instead of "Loading…" forever. */
function failLoading(msg){
  S.loadError = msg;
  showBanner(msg,{retry:true});
  render();
}
function loadErrorNode(cls){
  return S.loadError
    ? h('div',{class:cls}, h('p',{text:S.loadError}), h('button',{class:'btn primary',type:'button',text:'Retry',onclick:()=>location.reload()}))
    : null;
}

/* ---------- sync status: "Offline" / "Syncing…" next to the stats line ---------- */
function updateSyncStatus(){
  const el = $('#sync'), dot = $('#netDot'); if(!el) return;
  const offline = navigator.onLine===false;
  if(dot){ const label = offline ? 'Offline' : 'Online'; dot.classList.toggle('off', offline); dot.setAttribute('aria-label',label); dot.title = label; }   // green = online, red = offline
  const syncing = !!S.store && S.store.mode==='cloud' && Object.values(S.pending).some(Boolean);
  el.hidden = !(offline || syncing);
  el.textContent = offline ? (syncing ? 'Offline — changes will sync later' : 'Offline') : 'Syncing…';
  el.classList.toggle('off', offline);
}
window.addEventListener('online', updateSyncStatus);
window.addEventListener('offline', updateSyncStatus);

function setupPWA(){
  if(!/^https?:$/.test(location.protocol)) return;          // manifests need http(s)
  const base = location.href.split(/[?#]/)[0];
  const dir = base.replace(/[^/]*$/,'');
  const manifest = { id:base, name:'DataMap', short_name:'DataMap', description:'A visual map of where your information lives.',
    start_url:base, scope:dir, display:'standalone', background_color:'#F5F3F7', theme_color:'#F5F3F7',
    icons:[
      {src:ICON_192, sizes:'192x192', type:'image/png', purpose:'any'},
      {src:ICON_512, sizes:'512x512', type:'image/png', purpose:'any'},
      {src:ICON_MASK, sizes:'512x512', type:'image/png', purpose:'maskable'}
    ] };
  try{
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    const l = document.createElement('link'); l.rel='manifest'; l.href=url; document.head.append(l);
  }catch(e){}
}

(async function init(){
  try{ setupPWA(); }catch(e){}
  updateSyncStatus();
  render();
  // Accepts either shape: my CONFIG = { FIREBASE:{…} } block, or Firebase's own `const firebaseConfig = {…}` snippet pasted as-is.
  const fc = (typeof CONFIG!=='undefined' && CONFIG.FIREBASE) || (typeof firebaseConfig!=='undefined' ? firebaseConfig : {});
  if(!fc.apiKey || !fc.projectId){
    showBanner('Local mode — data is saved only in this browser. Add your Firebase config at the top of this file to sync online.');
    S.store = localStore();
  } else {
    if(typeof firebase==='undefined' || !firebase.firestore){ failLoading('Could not load Firebase. You may be offline — check your connection and retry.'); return; }
    try{ if(!firebase.apps.length) firebase.initializeApp(fc); }
    catch(e){ failLoading('Firebase config problem: '+((e&&e.message)||e)); return; }
    S.store = firebaseStore(firebase.firestore());
  }
  const onSyncError = e=>{
    const code = e && e.code;
    const msg = code==='permission-denied'
      ? 'Access denied by Firestore. In Firebase → Firestore → Rules, publish the open rules shown at the top of this file.'
      : 'Sync problem ('+((e&&(code||e.message))||'error')+'). Reload the page.';
    if(ready()) showBanner(msg,{retry:true}); else failLoading(msg);
  };
  COLLS.forEach(c=>{
    S.store.subscribe(c,
      m=>{ S[c]=m; S.got[c]=true; scheduleRender(); },
      onSyncError,
      pending=>{ S.pending[c]=pending; updateSyncStatus(); });
  });
  updateSyncStatus();
  try{ await S.store.start(); }catch(e){ onSyncError(e); }
})();
</script>
